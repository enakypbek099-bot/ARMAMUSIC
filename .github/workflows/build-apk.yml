name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android project
        run: |
          python3 - <<'PYEOF'
          import os

          ROOT = "android/app/src/main"

          java_dir = os.path.join(ROOT, "java", "com", "armamus", "player")
          os.makedirs(java_dir, exist_ok=True)
          with open(os.path.join(java_dir, "MainActivity.java"), "w", encoding="utf-8") as f:
              f.write("""package com.armamus.player;

          import android.graphics.Color;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setBackgroundColor(Color.parseColor("#050507"));
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightStatusBars(false);
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightNavigationBars(false);
              }

              @Override
              public void onStart() {
                  super.onStart();
                  try {
                      getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                  } catch (Exception ignored) {
                  }
              }
          }
          """)

          mf = os.path.join(ROOT, "AndroidManifest.xml")
          with open(mf, encoding="utf-8") as f:
              x = f.read()
          perms = [
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.POST_NOTIFICATIONS",
          ]
          add = ""
          for p in perms:
              if p not in x:
                  add += '    <uses-permission android:name="%s" />\n' % p
          x = x.replace("<application", add + "    <application", 1)
          if "android:largeHeap" not in x:
              x = x.replace("<application", '<application android:largeHeap="true"', 1)
          with open(mf, "w", encoding="utf-8") as f:
              f.write(x)
          print("patched")
          PYEOF

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: armamus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

