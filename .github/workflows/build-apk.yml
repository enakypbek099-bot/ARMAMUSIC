name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then cp index.html www/index.html; fi
          test -f www/index.html || { echo "index.html not found in repo (www/index.html or index.html)"; ls -la; exit 1; }

      - name: Validate index.html
        run: |
          tail -c 20 www/index.html | grep -q '</html>' || { echo "index.html is truncated: no closing </html> at the end"; exit 1; }
          python3 - <<'PYEOF'
          import re, subprocess, sys
          t = open("www/index.html", encoding="utf-8").read()
          for i, s in enumerate(re.findall(r"<script>(.*?)</script>", t, re.S)):
              f = "/tmp/s%d.js" % i
              open(f, "w", encoding="utf-8").write(s)
              r = subprocess.run(["node", "--check", f], capture_output=True, text=True)
              if r.returncode:
                  print("JS syntax error in script #%d" % i)
                  print(r.stderr)
                  sys.exit(1)
          print("index.html OK")
          PYEOF

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add native media player code
        run: |
          D=android/app/src/main/java/com/armamus/player
          mkdir -p "$D"

          cat > "$D/MediaCenter.java" <<'JEOF'
          package com.armamus.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.drawable.Icon;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.SystemClock;

          public class MediaCenter {
              public interface Listener {
                  void onAction(String action, long positionMs);
              }

              static final String CHANNEL = "armamus_playback";
              static final int NOTIF_ID = 4711;
              static Listener listener;
              static MediaSession session;
              static String title = "";
              static String artist = "";
              static Bitmap cover;
              static boolean playing;
              static long posMs;
              static long durMs;

              static void fire(String a, long p) {
                  if (listener != null) listener.onAction(a, p);
              }

              static synchronized void ensureSession(Context c) {
                  if (session != null) return;
                  session = new MediaSession(c.getApplicationContext(), "Armamus");
                  session.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { fire("play", 0); }
                      @Override public void onPause() { fire("pause", 0); }
                      @Override public void onSkipToNext() { fire("next", 0); }
                      @Override public void onSkipToPrevious() { fire("prev", 0); }
                      @Override public void onSeekTo(long pos) { fire("seekto", pos); }
                      @Override public void onStop() { fire("pause", 0); }
                  });
                  session.setActive(true);
              }

              static void apply(Context c) {
                  ensureSession(c);
                  MediaMetadata.Builder mb = new MediaMetadata.Builder()
                      .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                      .putString(MediaMetadata.METADATA_KEY_ARTIST, artist)
                      .putLong(MediaMetadata.METADATA_KEY_DURATION, durMs);
                  if (cover != null) mb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, cover);
                  session.setMetadata(mb.build());
                  long actions = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE
                      | PlaybackState.ACTION_PLAY_PAUSE | PlaybackState.ACTION_SKIP_TO_NEXT
                      | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_SEEK_TO
                      | PlaybackState.ACTION_STOP;
                  PlaybackState st = new PlaybackState.Builder()
                      .setActions(actions)
                      .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED,
                          posMs, playing ? 1f : 0f, SystemClock.elapsedRealtime())
                      .build();
                  session.setPlaybackState(st);
              }

              static void channel(Context c) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm.getNotificationChannel(CHANNEL) == null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Playback", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }
              }

              static PendingIntent act(Context c, String a) {
                  Intent i = new Intent(c, MediaService.class).setAction(a);
                  return PendingIntent.getService(c, a.hashCode(), i,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              static Notification build(Context c) {
                  ensureSession(c);
                  channel(c);
                  Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  PendingIntent open = PendingIntent.getActivity(c, 0, li,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = new Notification.Builder(c, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title.isEmpty() ? "Armamus" : title)
                      .setContentText(artist)
                      .setContentIntent(open)
                      .setOngoing(playing)
                      .setShowWhen(false)
                      .setOnlyAlertOnce(true)
                      .setVisibility(Notification.VISIBILITY_PUBLIC);
                  if (Build.VERSION.SDK_INT >= 31) {
                      b.setForegroundServiceBehavior(Notification.FOREGROUND_SERVICE_IMMEDIATE);
                  }
                  if (cover != null) b.setLargeIcon(cover);
                  b.addAction(new Notification.Action.Builder(
                      Icon.createWithResource(c, android.R.drawable.ic_media_previous), "Previous", act(c, "prev")).build());
                  b.addAction(new Notification.Action.Builder(
                      Icon.createWithResource(c, playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play),
                      playing ? "Pause" : "Play", act(c, playing ? "pause" : "play")).build());
                  b.addAction(new Notification.Action.Builder(
                      Icon.createWithResource(c, android.R.drawable.ic_media_next), "Next", act(c, "next")).build());
                  b.setStyle(new Notification.MediaStyle()
                      .setMediaSession(session.getSessionToken())
                      .setShowActionsInCompactView(0, 1, 2));
                  return b.build();
              }

              static void push(Context c) {
                  if (MediaService.running) {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.notify(NOTIF_ID, build(c));
                  } else {
                      Intent i = new Intent(c, MediaService.class).setAction("armamus.update");
                      c.startForegroundService(i);
                  }
              }
          }
          JEOF

          cat > "$D/MediaService.java" <<'JEOF'
          package com.armamus.player;

          import android.app.Notification;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class MediaService extends Service {
              static volatile boolean running;
              private PowerManager.WakeLock wl;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  running = true;
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Armamus:play");
                  wl.acquire(6L * 60L * 60L * 1000L);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String a = intent == null ? null : intent.getAction();
                  Notification n = MediaCenter.build(this);
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(MediaCenter.NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(MediaCenter.NOTIF_ID, n);
                  }
                  if (a != null && !"armamus.update".equals(a)) {
                      MediaCenter.fire(a, 0);
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (wl != null && wl.isHeld()) wl.release();
                  super.onDestroy();
              }
          }
          JEOF

          cat > "$D/ArmamusMediaPlugin.java" <<'JEOF'
          package com.armamus.player;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ArmamusMedia")
          public class ArmamusMediaPlugin extends Plugin {
              @Override
              public void load() {
                  MediaCenter.listener = new MediaCenter.Listener() {
                      @Override
                      public void onAction(String action, long positionMs) {
                          JSObject o = new JSObject();
                          o.put("action", action);
                          o.put("position", positionMs);
                          notifyListeners("action", o);
                      }
                  };
              }

              @PluginMethod
              public void update(PluginCall call) {
                  Context c = getContext();
                  MediaCenter.title = call.getString("title", "");
                  MediaCenter.artist = call.getString("artist", "");
                  Boolean reset = call.getBoolean("reset", false);
                  if (reset != null && reset) MediaCenter.cover = null;
                  String cov = call.getString("cover", "");
                  if (cov != null && !cov.isEmpty()) {
                      try {
                          byte[] b = Base64.decode(cov, Base64.DEFAULT);
                          Bitmap bm = BitmapFactory.decodeByteArray(b, 0, b.length);
                          if (bm != null) MediaCenter.cover = bm;
                      } catch (Exception ignored) {
                      }
                  }
                  Boolean pl = call.getBoolean("playing", false);
                  MediaCenter.playing = pl != null && pl;
                  Double pos = call.getDouble("position", 0.0);
                  Double dur = call.getDouble("duration", 0.0);
                  MediaCenter.posMs = (long) ((pos == null ? 0.0 : pos) * 1000.0);
                  MediaCenter.durMs = (long) ((dur == null ? 0.0 : dur) * 1000.0);
                  try {
                      MediaCenter.apply(c);
                      MediaCenter.push(c);
                  } catch (Exception ignored) {
                  }
                  call.resolve();
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  try {
                      getContext().stopService(new Intent(getContext(), MediaService.class));
                  } catch (Exception ignored) {
                  }
                  call.resolve();
              }
          }
          JEOF

          cat > "$D/MainActivity.java" <<'JEOF'
          package com.armamus.player;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ArmamusMediaPlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setBackgroundColor(Color.parseColor("#050507"));
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightStatusBars(false);
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightNavigationBars(false);
                  if (Build.VERSION.SDK_INT >= 33
                      && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 77);
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  try {
                      WebView w = getBridge().getWebView();
                      w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      w.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onStop() {
                  super.onStop();
                  keepAlive();
              }

              private void keepAlive() {
                  if (!MediaService.running) return;
                  try {
                      WebView w = getBridge().getWebView();
                      w.onResume();
                      w.resumeTimers();
                  } catch (Exception ignored) {
                  }
              }
          }
          JEOF

      - name: Patch manifest
        run: |
          python3 - <<'PYEOF'
          mf = "android/app/src/main/AndroidManifest.xml"
          with open(mf, encoding="utf-8") as f:
              x = f.read()
          perms = [
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.POST_NOTIFICATIONS",
          ]
          add = ""
          for p in perms:
              if p not in x:
                  add += '    <uses-permission android:name="%s" />\n' % p
          x = x.replace("<application", add + "    <application", 1)
          if "android:largeHeap" not in x:
              x = x.replace("<application", '<application android:largeHeap="true"', 1)
          svc = '    <service android:name=".MediaService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n'
          if "MediaService" not in x:
              x = x.replace("</application>", svc + "    </application>", 1)
          with open(mf, "w", encoding="utf-8") as f:
              f.write(x)
          print("manifest patched")
          PYEOF

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: armamus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
